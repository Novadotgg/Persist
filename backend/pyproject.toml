[project]
name = "personal-ai-assistant-backend"
version = "0.1.0"
description = "Production-grade backend for Personal AI Assistant OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "dramatiq[redis]>=1.17.0",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.5",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "pgvector>=0.2.5",
    "apscheduler>=3.10.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-text-splitters>=0.0.1",
    "langgraph>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
